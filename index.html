<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.I.R.E 로드맵 애널리틱스 &#x1F9ED;</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg-color: #f3f4f6;
            --panel-bg: #ffffff;
            --border-color: #e5e7eb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --highlight: #2563eb;
            --color-up: #3b82f6;
            --color-down: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden;
        }
        .sidebar { width: 440px; min-width: 440px; background-color: var(--bg-color); display: flex; flex-direction: column; gap: 16px; padding: 20px; overflow-y: auto; z-index: 20; transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar.collapsed { margin-left: -440px; }
        .toggle-wrapper { width: 20px; background: #e5e7eb; cursor: pointer; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--border-color); z-index: 30; color: #6b7280; font-size: 0.8rem; }
        .portfolio-card { background-color: var(--panel-bg); border-radius: 12px; padding: 16px; box-shadow: var(--shadow-sm); border-top: 5px solid; }
        .portfolio-card.hidden-card { opacity: 0.5; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .name-input { flex: 1; min-width: 150px; font-size: 1.1rem; font-weight: 700; color: var(--text-main); border: none; border-bottom: 1px dashed var(--border-color); padding: 2px 0; background: transparent; outline: none; }
        .toggle-group { display: flex; gap: 12px; align-items: center; }
        .vis-toggle { font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 4px; font-weight: 600; color: var(--text-muted); }
        .sync-toggle { font-size: 0.8rem; color: #4f46e5; cursor: pointer; display: flex; align-items: center; gap: 4px; background: #e0e7ff; padding: 4px 8px; border-radius: 6px; font-weight: 600; }
        .sync-toggle.active { background: #4f46e5; color: white; }
        .sync-toggle input { display: none; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 0.8rem; font-weight: 600; color: #4b5563; }
        .input-wrapper { display: flex; align-items: center; background: #f9fafb; border: 1px solid #d1d5db; border-radius: 6px; overflow: hidden; }
        .input-wrapper input[type="number"] { flex: 1; width: 100%; padding: 6px 8px; border: none; background: transparent; text-align: right; font-family: inherit; font-size: 0.9rem; outline: none; }
        .unit { font-size: 0.8rem; color: var(--text-muted); padding-right: 8px; background: #f9fafb; }
        .reinvest-row { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; background: #f9fafb; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; }
        .reset-overrides-btn { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; font-weight: bold; margin-top: 8px; width: 100%; }
        .btn-add { border: 2px dashed #9ca3af; background: transparent; color: #4b5563; padding: 12px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .toggle-switch { position: relative; display: inline-block; width: 36px; height: 20px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; border-radius: 20px; transition: .3s; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .3s; }
        input:checked + .slider { background-color: var(--color); }
        input:checked + .slider:before { transform: translateX(16px); }
        .main-content { flex: 1; padding: 24px; display: flex; flex-direction: column; background-color: var(--bg-color); overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; }
        .header h1 { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
        .header .subtitle { font-size: 0.9rem; color: var(--text-muted); font-weight: 500;}
        .chart-container { flex-shrink: 0; height: 440px; background-color: var(--panel-bg); border-radius: 12px; padding: 16px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }
        .table-section { background-color: var(--panel-bg); border-radius: 12px; box-shadow: var(--shadow-sm); overflow: hidden; flex: 1; display: flex; flex-direction: column; }
        .table-wrapper { overflow: auto; flex: 1; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.8rem; table-layout: fixed; }
        th, td { padding: 4px; border-bottom: 1px solid var(--border-color); border-right: 1px solid var(--border-color); text-align: center; white-space: nowrap; height: 36px; vertical-align: middle; }
        .inline-input { width: 100%; height: 100%; padding: 4px; font-size: 0.8rem; text-align: center; border: 1px solid transparent; border-radius: 4px; outline: none; background: transparent; color: var(--text-main); font-family: inherit; }
        .inline-input:hover { border-color: #d1d5db; background: #f9fafb; }
        .inline-input:focus { border-color: #3b82f6; background: #fff; }
        .is-overridden { color: var(--highlight); font-weight: 800; background-color: #eff6ff; border-color: #93c5fd; }
        th { background-color: #f8fafc; font-weight: 700; position: sticky; top: 0; z-index: 10; }
        thead tr:nth-child(2) th { top: 31px; }
        th:nth-child(1), td:nth-child(1) { position: sticky; left: 0; background-color: #f8fafc; z-index: 11; width: 45px; }
        th:nth-child(1) { z-index: 12; }
        .text-bold { font-weight: 700; }
        .color-up { color: var(--color-up); font-weight: bold; }
        .color-down { color: var(--color-down); font-weight: bold; }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar"></div>
    <div class="toggle-wrapper" onclick="toggleSidebar()"><div id="toggleIcon">◀</div></div>
    <div class="main-content">
        <div class="header">
            <h1>F.I.R.E 로드맵 애널리틱스 &#x1F9ED;</h1>
            <div class="subtitle">💡 월 배당금(현금흐름)을 확인하며 경제적 자유 시점을 설계해보세요.</div>
        </div>
        <div class="chart-container"><canvas id="growthChart"></canvas></div>
        <div class="table-section">
            <div class="table-wrapper">
                <table id="dataTable"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
            </div>
        </div>
    </div>
    <script>
        const TAX_RATE = 15.4;
        const PALETTE = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];
        const COLOR_UP = '#3b82f6';
        const COLOR_DOWN = '#ef4444';
        let chartInstance = null;
        let windowSimData = [];
        let portfolios = [
            { id: 'A', name: 'S&P 500 주도 (A)', initialAsset: 0, baseMonthly: 200, inc: 3, growth: 8, div: 1.5, reinvest: true, visible: true, syncWithA: false, color: PALETTE[0], overrides: {} },
            { id: 'B', name: '고배당 전환형 (B)', initialAsset: 0, baseMonthly: 200, inc: 3, growth: 8, div: 1.5, reinvest: true, visible: true, syncWithA: false, color: PALETTE[1], overrides: {} }
        ];
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const icon = document.getElementById('toggleIcon');
            sb.classList.toggle('collapsed');
            icon.innerText = sb.classList.contains('collapsed') ? '▶' : '◀';
            setTimeout(() => { if(chartInstance) chartInstance.resize(); }, 300);
        }
        function formatMoneyKor(value) {
            if (value === 0 || Math.abs(value) < 1) return '0원';
            const isNeg = value < 0;
            const absVal = Math.abs(value);
            const uk = Math.floor(absVal / 10000);
            const man = Math.floor(absVal % 10000);
            let result = '';
            if (uk > 0) result += uk + '억 ';
            if (man > 0) result += man.toLocaleString() + '만';
            return isNeg ? '-' + result.trim() : (result.trim() || '0원');
        }
        function formatNum(val) { return Number(val).toLocaleString(undefined, {maximumFractionDigits: 1}); }
        function updatePort(id, key, val) {
            const p = portfolios.find(x => x.id === id);
            if (['visible', 'reinvest', 'syncWithA'].includes(key)) p[key] = val;
            else if (key === 'name') p[key] = val;
            else p[key] = parseFloat(val) || 0;
            if (id === 'A') {
                portfolios.forEach(port => {
                    if (port.id !== 'A' && port.syncWithA && !['name', 'visible', 'overrides'].includes(key)) port[key] = p[key];
                });
            } else {
                if (!['visible', 'name', 'syncWithA'].includes(key)) p.syncWithA = false;
                if (key === 'syncWithA' && val === true) {
                    const baseA = portfolios.find(x => x.id === 'A');
                    ['initialAsset', 'baseMonthly', 'inc', 'growth', 'div', 'reinvest'].forEach(k => p[k] = baseA[k]);
                }
            }
            renderAll();
        }
        function setOverride(portId, year, key, valStr) {
            const p = portfolios.find(x => x.id === portId);
            if (valStr.trim() === '') {
                if (p.overrides[year]) {
                    delete p.overrides[year][key];
                    if (Object.keys(p.overrides[year]).length === 0) delete p.overrides[year];
                }
            } else {
                if (!p.overrides[year]) p.overrides[year] = {};
                p.overrides[year][key] = parseFloat(valStr) || 0;
            }
            p.syncWithA = false;
            renderAll();
        }
        function clearOverrides(portId) {
            if(confirm('이 포트폴리오의 타임라인(테이블) 수정 내역을 모두 초기화하시겠습니까?')) {
                portfolios.find(x => x.id === portId).overrides = {};
                renderAll();
            }
        }
        function addPortfolio() {
            const newId = String.fromCharCode(65 + portfolios.length);
            portfolios.push({ id: newId, name: '신규 전략 (' + newId + ')', initialAsset: 0, baseMonthly: 100, inc: 3, growth: 6, div: 2, reinvest: true, visible: true, syncWithA: false, color: PALETTE[portfolios.length % PALETTE.length], overrides: {} });
            renderAll();
        }
        function calculateData(p) {
            let currentAsset = p.initialAsset;
            let runningMonthly = p.baseMonthly;
            let runningInc = p.inc;
            let runningGrowth = p.growth;
            let runningDiv = p.div;
            const data = [];
            for (let y = 1; y <= 40; y++) {
                let overM = false, overI = false, overG = false, overD = false;
                if (p.overrides[y]) {
                    if (p.overrides[y].inc !== undefined) { runningInc = p.overrides[y].inc; overI = true; }
                    if (p.overrides[y].monthly !== undefined) { runningMonthly = p.overrides[y].monthly; overM = true; }
                    if (p.overrides[y].growth !== undefined) { runningGrowth = p.overrides[y].growth; overG = true; }
                    if (p.overrides[y].div !== undefined) { runningDiv = p.overrides[y].div; overD = true; }
                }
                if (y > 1 && !overM) runningMonthly = runningMonthly * (1 + (runningInc / 100));
                let monthlyGrowthDec = Math.pow(1 + (runningGrowth / 100), 1/12) - 1;
                for (let m = 0; m < 12; m++) currentAsset = currentAsset * (1 + monthlyGrowthDec) + runningMonthly;
                let netDiv = (currentAsset * (runningDiv / 100)) * (1 - TAX_RATE / 100);
                if (p.reinvest) currentAsset += netDiv;
                data.push({ year: y, monthly: runningMonthly, overM, inc: runningInc, overI, growth: runningGrowth, overG, div: runningDiv, overD, dividend: netDiv, asset: currentAsset });
            }
            return data;
        }
        function renderSidebar() {
            const sb = document.getElementById('sidebar');
            sb.innerHTML = '';
            portfolios.forEach(p => {
                const hasOverrides = Object.keys(p.overrides).length > 0;
                const card = document.createElement('div');
                card.className = 'portfolio-card ' + (p.visible ? '' : 'hidden-card');
                card.style.borderColor = p.color;
                card.style.setProperty('--color', p.color);
                card.innerHTML = '<div class="card-header"><input type="text" class="name-input" value="'+p.name+'" onchange="updatePort(\''+p.id+'\', \'name\', this.value)"><div class="toggle-group">'+(p.id!=='A'?'<label class="sync-toggle '+(p.syncWithA?'active':'')+'"><input type="checkbox" '+(p.syncWithA?'checked':'')+' onchange="updatePort(\''+p.id+'\', \'syncWithA\', this.checked)">A와 상동</label>':'')+'<label class="vis-toggle"><input type="checkbox" '+(p.visible?'checked':'')+' onchange="updatePort(\''+p.id+'\', \'visible\', this.checked)">표시</label></div></div>'+
                '<div class="input-grid"><div class="input-group"><label>초기 자산</label><div class="input-wrapper"><input type="number" value="'+p.initialAsset+'" step="100" onchange="updatePort(\''+p.id+'\', \'initialAsset\', this.value)"><span class="unit">만</span></div></div><div class="input-group"><label>시작 납입금</label><div class="input-wrapper"><input type="number" value="'+p.baseMonthly+'" step="10" onchange="updatePort(\''+p.id+'\', \'baseMonthly\', this.value)"><span class="unit">만</span></div></div><div class="input-group"><label>납입금 연 증가율</label><div class="input-wrapper"><input type="number" value="'+p.inc+'" step="1" onchange="updatePort(\''+p.id+'\', \'inc\', this.value)"><span class="unit">%</span></div></div><div class="input-group"><label>시작 연 성장률</label><div class="input-wrapper"><input type="number" value="'+p.growth+'" step="0.5" onchange="updatePort(\''+p.id+'\', \'growth\', this.value)"><span class="unit">%</span></div></div><div class="input-group"><label>시작 연 배당률</label><div class="input-wrapper"><input type="number" value="'+p.div+'" step="0.5" onchange="updatePort(\''+p.id+'\', \'div\', this.value)"><span class="unit">%</span></div></div></div>'+
                '<div class="reinvest-row"><span>배당금 재투자 적용</span><label class="toggle-switch"><input type="checkbox" '+(p.reinvest?'checked':'')+' onchange="updatePort(\''+p.id+'\', \'reinvest\', this.checked)"><span class="slider"></span></label></div>'+
                (hasOverrides?'<button class="reset-overrides-btn" onclick="clearOverrides(\''+p.id+'\')">테이블 수정 내역 초기화</button>':'');
                sb.appendChild(card);
            });
            const addBtn = document.createElement('button');
            addBtn.className = 'btn-add'; addBtn.innerText = '+ 포트폴리오 추가'; addBtn.onclick = addPortfolio;
            sb.appendChild(addBtn);
        }
        const decadeLabelPlugin = {
            id: 'decadeLabels',
            afterDatasetsDraw(chart) {
                const ctx = chart.ctx;
                [9,19,29,39].forEach(index => {
                    let items = []; let baseVal = null, baseDiv = null, baseIndex = -1;
                    chart.data.datasets.forEach((dataset, i) => {
                        const meta = chart.getDatasetMeta(i);
                        if (!meta.hidden) {
                            let val = dataset.data[index];
                            let monthlyDiv = windowSimData[i][index].dividend / 12;
                            if (baseVal === null) { baseVal = val; baseDiv = monthlyDiv; baseIndex = i; }
                            items.push({ val, monthlyDiv, x: meta.data[index].x, y: meta.data[index].y, color: dataset.borderColor, isBase: (i === baseIndex), id: dataset.portId });
                        }
                    });
                    if (!items.length) return;
                    let baseX = items[0].x;
                    ctx.save(); ctx.beginPath(); ctx.moveTo(baseX, chart.chartArea.top); ctx.lineTo(baseX, chart.chartArea.bottom);
                    ctx.strokeStyle = 'rgba(200,200,200,0.4)'; ctx.lineWidth = 1; ctx.setLineDash([4,4]); ctx.stroke(); ctx.restore();
                    items.sort((a,b)=>b.val-a.val);
                    ctx.font = 'bold 12px Pretendard';
                    const pipeStr = ' | '; const pipeW = ctx.measureText(pipeStr).width;
                    items.forEach(pt => {
                        pt.assetStr = formatMoneyKor(pt.val);
                        pt.divStr = '월 ' + formatMoneyKor(pt.monthlyDiv);
                        pt.assetW = ctx.measureText(pt.assetStr).width;
                        pt.divW = ctx.measureText(pt.divStr).width;
                        pt.hasGap = items.length > 1 && !pt.isBase;
                        if (pt.hasGap) {
                            let gapAsset = pt.val - baseVal, gapDiv = pt.monthlyDiv - baseDiv;
                            pt.gapAssetStr = (gapAsset>0?'+':'') + formatMoneyKor(gapAsset);
                            pt.gapAssetW = ctx.measureText(pt.gapAssetStr).width;
                            pt.gapAssetColor = gapAsset>0?COLOR_UP:(gapAsset<0?COLOR_DOWN:'#6b7280');
                            pt.gapDivStr = (gapDiv>0?'+':'') + formatMoneyKor(gapDiv);
                            pt.gapDivW = ctx.measureText(pt.gapDivStr).width;
                            pt.gapDivColor = gapDiv>0?COLOR_UP:(gapDiv<0?COLOR_DOWN:'#6b7280');
                        } else { pt.gapAssetW = 0; pt.gapDivW = 0; }
                        pt.maxLeftW = Math.max(pt.assetW, pt.gapAssetW);
                        pt.maxRightW = Math.max(pt.divW, pt.gapDivW);
                        pt.boxW = pt.maxLeftW + pipeW + pt.maxRightW + 40;
                        pt.boxH = pt.hasGap ? 44 : 24;
                    });
                    let highestY = Math.min(...items.map(p=>p.y));
                    let totalHeight = items.reduce((s,pt)=>s+pt.boxH+6,0);
                    let startY = highestY - totalHeight - 10;
                    if (startY < chart.chartArea.top + 5) startY = chart.chartArea.top + 5;
                    let currentY = startY;
                    items.forEach(pt => {
                        let centerX = baseX;
                        ctx.save();
                        ctx.fillStyle = 'rgba(255,255,255,0.9)';
                        if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(centerX-pt.boxW/2, currentY, pt.boxW, pt.boxH, 6); ctx.fill(); }
                        else ctx.fillRect(centerX-pt.boxW/2, currentY, pt.boxW, pt.boxH);
                        let row1Y = currentY + (pt.hasGap ? 12 : pt.boxH/2);
                        ctx.fillStyle = pt.color; ctx.font = '900 15px Pretendard'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText(pt.id, centerX - pt.maxLeftW - pipeW/2 - 14, row1Y);
                        ctx.font = 'bold 12px Pretendard';
                        ctx.fillStyle = '#111827'; ctx.textAlign = 'right'; ctx.fillText(pt.assetStr, centerX - pipeW/2, row1Y);
                        ctx.fillStyle = '#9ca3af'; ctx.textAlign = 'center'; ctx.fillText(pipeStr, centerX, row1Y - 1);
                        ctx.fillStyle = '#111827'; ctx.textAlign = 'left'; ctx.fillText(pt.divStr, centerX + pipeW/2, row1Y);
                        if (pt.hasGap) {
                            let row2Y = currentY + 31;
                            ctx.fillStyle = pt.gapAssetColor; ctx.textAlign = 'right'; ctx.fillText(pt.gapAssetStr, centerX - pipeW/2, row2Y);
                            ctx.fillStyle = '#9ca3af'; ctx.textAlign = 'center'; ctx.fillText(pipeStr, centerX, row2Y - 1);
                            ctx.fillStyle = pt.gapDivColor; ctx.textAlign = 'left'; ctx.fillText(pt.gapDivStr, centerX + pipeW/2, row2Y);
                        }
                        ctx.restore();
                        currentY += pt.boxH + 6;
                    });
                });
            }
        };
        function initChart() {
            chartInstance = new Chart(document.getElementById('growthChart').getContext('2d'), {
                type: 'line', plugins: [decadeLabelPlugin],
                data: { labels: Array.from({length: 40}, (_, i) => (i + 1) + '년'), datasets: [] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    layout: { padding: { top: 20, right: 140, bottom: 5 } },
                    interaction: { mode: 'index', intersect: false },
                    plugins: { tooltip: { callbacks: { label: function(c) { let monthDiv = windowSimData[c.datasetIndex][c.dataIndex].dividend / 12; return ' ' + c.dataset.label + ': ' + formatMoneyKor(c.raw) + ' (월배당 ' + formatMoneyKor(monthDiv) + ')'; } } } },
                    scales: { y: { grace: '20%', ticks: { callback: (v) => formatMoneyKor(v) } }, x: { grid: { display: false } } }
                }
            });
        }
        function renderTableAndChart() {
            const visiblePorts = portfolios.filter(p => p.visible);
            windowSimData = visiblePorts.map(p => calculateData(p));
            chartInstance.data.datasets = visiblePorts.map((p, i) => ({ label: p.name, data: windowSimData[i].map(d => d.asset), borderColor: p.color, backgroundColor: p.color + '20', borderWidth: 2, tension: 0.2, pointRadius: 0, fill: false, portId: p.id }));
            chartInstance.update();
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            thead.innerHTML = ''; tbody.innerHTML = '';
            if (!visiblePorts.length) return;
            let tr1 = '<tr><th rowspan="2">연차</th>';
            let tr2 = '<tr>';
            visiblePorts.forEach(p => {
                tr1 += '<th colspan="6" style="color:'+p.color+';border-left:2px solid '+p.color+';">'+p.name+'</th>';
                tr2 += '<th style="border-left:2px solid '+p.color+';">납입(만)</th><th>증가(%)</th><th>성장(%)</th><th>배당(%)</th><th style="color:'+p.color+';">월배당액</th><th style="color:'+p.color+';">누적 자산</th>';
            });
            if (visiblePorts.length > 1) {
                tr1 += '<th colspan="'+(visiblePorts.length-1)*2+'">[기준: '+visiblePorts[0].id+'] 대비 차액</th>';
                for (let i=1;i<visiblePorts.length;i++) tr2 += '<th>'+visiblePorts[i].id+' - '+visiblePorts[0].id+'</th><th>Gap(%)</th>';
            }
            thead.innerHTML = tr1+'</tr>'+tr2+'</tr>';
            for (let y=0;y<40;y++) {
                const tr = document.createElement('tr');
                let rowHtml = '<td>'+(y+1)+'년</td>';
                visiblePorts.forEach((p, idx) => {
                    const d = windowSimData[idx][y];
                    rowHtml += '<td style="border-left:2px solid '+p.color+';"><input type="number" class="inline-input '+(d.overM?'is-overridden':'')+'" value="'+formatNum(d.monthly)+'" onchange="setOverride(\''+p.id+'\', '+(y+1)+', \'monthly\', this.value)"></td>';
                    rowHtml += '<td><input type="number" class="inline-input '+(d.overI?'is-overridden':'')+'" value="'+formatNum(d.inc)+'" onchange="setOverride(\''+p.id+'\', '+(y+1)+', \'inc\', this.value)"></td>';
                    rowHtml += '<td><input type="number" class="inline-input '+(d.overG?'is-overridden':'')+'" value="'+formatNum(d.growth)+'" onchange="setOverride(\''+p.id+'\', '+(y+1)+', \'growth\', this.value)"></td>';
                    rowHtml += '<td><input type="number" class="inline-input '+(d.overD?'is-overridden':'')+'" value="'+formatNum(d.div)+'" onchange="setOverride(\''+p.id+'\', '+(y+1)+', \'div\', this.value)"></td>';
                    rowHtml += '<td style="color:'+p.color+';">'+formatMoneyKor(d.dividend/12)+'</td>';
                    rowHtml += '<td class="text-bold" style="color:'+p.color+';">'+formatMoneyKor(d.asset)+'</td>';
                });
                if (visiblePorts.length > 1) {
                    const baseAsset = windowSimData[0][y].asset;
                    for (let i=1;i<visiblePorts.length;i++) {
                        const diff = windowSimData[i][y].asset - baseAsset;
                        const gapPercent = baseAsset>0 ? (diff/baseAsset)*100 : 0;
                        const sign = diff>0?'+':'';
                        const colorClass = diff>0?'color-up':(diff<0?'color-down':'');
                        rowHtml += '<td class="'+colorClass+'">'+sign+formatMoneyKor(diff)+'</td><td class="'+colorClass+'">'+sign+gapPercent.toFixed(1)+'%</td>';
                    }
                }
                tr.innerHTML = rowHtml;
                tbody.appendChild(tr);
            }
        }
        function renderAll() { renderSidebar(); renderTableAndChart(); }
        window.onload = function(){ initChart(); renderAll(); };
    </script>
</body>
</html>
