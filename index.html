<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F.I.R.E 로드맵 애널리틱스 &#x1F9ED;</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="sidebar" id="sidebar"></div>
<div class="toggle-wrapper" onclick="toggleSidebar()"><div id="toggleIcon">&#9664;</div></div>
<div class="main-content">
<div class="app-tabs">
<button type="button" class="app-tab active" id="tabGrowth" onclick="switchView('growth')">자산 성장</button>
<button type="button" class="app-tab" id="tabCash" onclick="switchView('cash')">현금흐름 Income vs Spending</button>
</div>
<div class="header">
<h1>F.I.R.E 로드맵 애널리틱스 &#x1F9ED;</h1>
<div class="subtitle">월 배당금을 확인하며 경제적 자유 시점을 설계하세요.</div>
<div id="fireBadge" class="fire-badge">기본 경로만 표시</div>
</div>
<div id="cashView" class="cash-view" style="display:none">
<div class="cash-grid">
<div class="cash-panel">
<div class="life-title">월 수입 (만원)</div>
<div class="life-hint">1 / 10 / 20 / 30 / 40년차만 넣고 사이는 직선으로 이어집니다.</div>
<div class="anchor-row" id="incomeRow"></div>
<div class="life-title" style="margin-top:16px">월 소비 breakdown</div>
<div id="spendList"></div>
<button class="btn-add" style="margin-top:8px" onclick="addSpend()">+ 소비 항목 추가</button>
</div>
<div class="cash-panel">
<div class="life-title">Income vs Spending</div>
<div class="life-hint">초록 구간이 월 잔여 = 투자 가능액입니다.</div>
<div class="chart-box" style="height:320px"><canvas id="cashChart"></canvas></div>
<div id="leftoverStrip" class="leftover-strip"></div>
</div>
</div>
</div>
<div class="chart-container" id="growthBlock">
<div class="chart-toolbar">
<button type="button" class="range-chip" data-to="1">1년</button>
<button type="button" class="range-chip" data-to="10">10년</button>
<button type="button" class="range-chip" data-to="20">20년</button>
<button type="button" class="range-chip" data-to="30">30년</button>
<button type="button" class="range-chip active" data-to="40">40년</button>
<label class="fit-toggle">Y축 구간 맞춤 <label class="toggle-switch"><input id="fitY" type="checkbox" checked><span class="slider"></span></label></label>
</div>
<div class="chart-box"><canvas id="growthChart"></canvas></div>
</div>
<div class="table-section" id="tableBlock">
<div class="table-wrapper"><table id="dataTable"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
